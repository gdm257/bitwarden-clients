name: Build bwadmin

on:
  push:
    paths:
      - 'apps/bwadmin/**'
      - 'libs/**'
      - '.github/workflows/build-bwadmin.yml'
    tags:
      - 'bwadmin-v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/bwadmin

jobs:
  bwadmin:
    name: bwadmin ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: "lin", distro: "ubuntu-22.04", dir: "linux" }
          - { target: "lin-arm64", distro: "ubuntu-22.04-arm", dir: "linux-arm64" }
          - { target: "mac", distro: "macos-15-intel", dir: "macos" }
          - { target: "mac-arm64", distro: "macos-15", dir: "macos-arm64" }
          - { target: "win", distro: "windows-2022", dir: "windows" }
    runs-on: ${{ matrix.distro }}
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version-file: .nvmrc

      # Pin npm so every workflow produces and validates the same package-lock.json.
      - name: Pin npm version
        run: npm install --global npm@11.18.0

      - name: Install
        run: npm ci
        working-directory: ./

      - name: Get Package Version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#bwadmin-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        working-directory: ./

      - name: Build & Package
        run: npm run "dist:oss:${{ matrix.target }}" --quiet

      - name: Smoke test
        if: ${{ matrix.target != 'win' }}
        run: |
          chmod +x "./dist/oss/${{ matrix.dir }}/bwadmin"
          "./dist/oss/${{ matrix.dir }}/bwadmin" --help

      - name: Smoke test Windows
        if: ${{ matrix.target == 'win' }}
        run: ./dist/oss/windows/bwadmin.exe --help

      - name: Zip Unix
        if: ${{ matrix.target != 'win' }}
        run: |
          cd "./dist/oss/${{ matrix.dir }}"
          zip "../../../bwadmin-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip" ./bwadmin

      - name: Zip Windows
        if: ${{ matrix.target == 'win' }}
        shell: pwsh
        run: Compress-Archive -Path ./dist/oss/windows/bwadmin.exe -DestinationPath "./bwadmin-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip"

      - name: Upload zip asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bwadmin-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip
          path: apps/bwadmin/bwadmin-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Release
    needs: bwadmin
    if: ${{ startsWith(github.ref, 'refs/tags/bwadmin-v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download zip assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bwadmin-*
          path: dist
          merge-multiple: true

      - name: Get Package Version
        id: version
        working-directory: ./
        run: |
          VERSION="${GITHUB_REF_NAME#bwadmin-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          name: bwadmin ${{ steps.version.outputs.version }}
          files: dist/*
